# Checks to see if the student is blocked from submitting a part when the max lateness is reached

name: Submit assignment late by 30 mins (partial signature) (no penalty)
seedFile: fixtures/course-tp-assignment.sql
steps:
  ##############################################################################
  # Set up a late policy
  - authenticateUser:
      username: test@featurebench-test.com
      password: Password!
  - open: /
  - setViewport:
      width: 1280
      height: 720
  - waitFor: 200
  - tapOn:
      text: E2E Test Course
  - tapOn:
      text: Course Details
  - typeText:
      dataCy: max-lateness
      text: "84" # hours
  - typeText:
      dataCy: penalty-percent
      text: "20" # percent
  - selectOption:
      dataCy: penalty-type
      option: PER_DAY
  - tapOn:
      text: Save late policy
  ##############################################################################
  # Modify assignment due date to 49 hrs ago; this puts us in the 3 days late state
  - sql: UPDATE "Assignment" SET "dueDate" = NOW() - INTERVAL '49 hours' WHERE "name" = 'E2E Test Assignment (30 mins late)'
  ##############################################################################
  # Log in as a student
  - authenticateUser:
      username: student@featurebench-test.com
      password: Password!
  - open: /
  - setViewport:
      width: 1280
      height: 720
  - waitFor: 200
  - tapOn:
      text: E2E Test Course
  - assertVisible:
      text: E2E Test Assignment (30 mins late)
  - tapOn:
      text: E2E Test Assignment (30 mins late)
  - assertVisible:
      text: This is a test assignment, generated by and for E2E tests.
  - assertVisible:
      text: "Late submissions are allowed. Limit: 3.5 days past the deadline. Penalty: 20% per day late."
  - assertVisible:
      text: This assignment is past due. A late penalty will be applied.
  ##############################################################################
  # Submit the signature
  - selectFile:
      filePath: cypress/fixtures/SLDPRT/test/test.no-chamfer.SLDPRT
      dataCy: part-file
      allowScroll: true
  - tapOn:
      text: Upload submission
  - assertVisible:
      text: Grading your part…
  - assertVisible:
      text: You're up next!
  - assertVisible:
      text: Position 1 of 1
  - assertVisible:
      text: "Grade earned: 28/100" # 70 with 20% penalty repeated 3 times
  - assertVisible:
      text: Late penalty applied (original score 70/100).
  - assertVisible:
      text: "Hint: This is a test feedback"
  ##############################################################################
  # Verify the student has an accurate grade and feedback
  - authenticateUser:
      username: test@featurebench-test.com
      password: Password!
  - open: /
  - waitFor: 200
  - tapOn:
      text: E2E Test Course
  - tapOn:
      text: E2E Test Assignment (30 mins late)
  - assertVisible:
      dataCy: "submission-Test Student"
      parentSelector: div[class^="_teacherSubmissionList"]
  - assertVisible:
      parentCy: submission-Test Student
      text: "Test Student"
  - assertVisible:
      parentCy: submission-Test Student
      text: "28/100"
  - assertVisible:
      parentCy: submission-Test Student
      text: "1 attempt"
  - tapOn:
      text: View
      parentCy: submission-Test Student
  - assertVisible:
      text: "Grade earned: 28/100"
  - assertVisible:
      text: Late penalty applied (original score 70/100).
  - assertVisible:
      text: "Hint: This is a test feedback"
  - tapOn:
      text: "Close"
      allowScroll: true
  ##############################################################################
  # Check that the student's grade is accurately reflected in the gradebook
  - tapOn:
      text: Gradebook
  - assertVisible:
      dataCy: "gradebook-column-cmjjh4z2n0001qrmblp8k7s9e" # E2E Test Assignment (30 mins late)
      parentCy: "gradebook-row-Test Student"
      text: "28.0%"
  - assertVisible:
      dataCy: "gradebook-column-cmjjh4z2n0001qrmblp8k7s9e" # E2E Test Assignment (30 mins late)
      parentCy: "gradebook-row-Test Student"
      text: "28/100"
  - tapOn:
      dataCy: "gradebook-scored-button-cmjjh4z2n0001qrmblp8k7s9e" # E2E Test Assignment (30 mins late)
      parentCy: "gradebook-row-Test Student"
  - assertVisible:
      text: "Grade earned: 28/100"
  - assertVisible:
      text: Late penalty applied (original score 70/100).
  - assertVisible:
      text: "Hint: This is a test feedback"
  - tapOn:
      text: "Close"
      allowScroll: true
  - assertVisible:
      text: "28.0%"
      selector: '[class^="_averageCell"]'
      parentCy: "gradebook-row-Test Student"
  ##############################################################################
  # Check that the student's grade is accurately reflected in the roster
  - tapOn:
      text: Roster
  - tapOn:
      text: Test Student
      parentSelector: '[class^="_roster"] [class^="_column"]'
  - assertVisible:
      text: "28/100"
      parentCy: "grade-row-E2E Test Assignment (30 mins late)"
  - assertVisible:
      text: "28.0%"
      parentCy: "grade-row-E2E Test Assignment (30 mins late)"
  - tapOn:
      text: "View"
      parentCy: "grade-row-E2E Test Assignment (30 mins late)"
  - assertVisible:
      text: "Grade earned: 28/100"
  - assertVisible:
      text: Late penalty applied (original score 70/100).
  - assertVisible:
      text: "Hint: This is a test feedback"
  - tapOn:
      text: "Close"
      allowScroll: true
